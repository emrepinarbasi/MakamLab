report.glossary.deviation=Hesaplama: gözlemlenen pozisyon - kuramsal hedef. Örnek: hedef 90 C ise ve ölçüm 86 C ise, sapma -4 C olur, bu 4 C flat anlamına gelir. Bir 94 C ölçümü +4 C olur, yani 4 C sharp.
