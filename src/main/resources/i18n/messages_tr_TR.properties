report.method.directional.averages=Çıkıcı, inici ve kalış ortalamaları kendi olaylarından hesaplanır. Tümü satırı grup ortalamalarının ortalaması değildir; kabul edilen her olayı bir kez içerir.
report.method.directional.candidate=Adaylar Dügâh ile Bûselik arasındaki seslerden seçilir; iki sınır perdesi de kapsam dışı bırakılır.
report.method.directional.deviation=Her adayın ölçülen frekansı kuramsal Segâh merkeziyle karşılaştırılır. Negatif sapma daha pes, pozitif sapma daha tiz bir Segâh icrasını gösterir.
report.method.directional.path=Güvenilir bir Dügâh→Segâh hareketi çıkıcı, Segâh→Dügâh hareketi ise inici olarak sınıflandırılır. Aynı yönde Çargâh ve Nevâ'nın izlenmesi cümle kanıtını güçlendirir; ancak zorunlu değildir.
report.method.directional.sustain=Belirgin bir çıkıcı veya inici yolu bulunmayan uzun ve kararlı Segâh sesleri, Segâh kalışı olarak ayrıca değerlendirilir.
