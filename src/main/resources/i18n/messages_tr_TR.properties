report.limit.profileNotDiagnosisDetailed=Karara hizalı aralık profili benzerliği otomatik makam teşhisi değildir; sonuç seyir, güçlü, çeşni, geçki ve kalış kanıtlarıyla birlikte değerlendirilmelidir.
