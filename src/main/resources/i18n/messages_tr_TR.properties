report.prose.allRow=Tümü satırı, üç grup ortalamasının basit ortalaması değildir. Kabul edilen her olay bir kez kullanılarak yeniden hesaplanır, böylece daha fazla etkinliğe sahip bir grup genel sonuca kendi doğal ağırlığıyla katkıda bulunur.
report.prose.closestFirstFourGroup={0} grubu içinde birlikte değerlendirilen makam profilleri: {1}. Bu profiller aynı ilk dört teorik dereceye sahiptir ve birbirlerinden yalnızca bu kanıtlarla ayırt edilemezler.
report.prose.directionalCharts=Üç grafik bağımsızdır: ilki sadece çıkıcı ifadeleri, ikincisi sadece düşen ifadeleri ve üçüncüsü sadece doğrudan Segâh uzatmalarını gösterir. Gölgelendirilmiş alan her grafikte aynı aday-arama alanıdır; tüm alan otomatik olarak Segâh olarak değerlendirilmez. Turkuaz çizgi kuramsal Segâh merkezini, renkli noktalar ise ilgili grupta kabul edilen birleşik müzik kullanımlarını işaret eder.
report.prose.directionalEvents=Her satır, birincil istatistiklere dahil edilen bir Segâh kullanımı gösterir. Gözlemlenen yol sütunu, yön kararının dayandığı adım sırasını açıklar. Aynı müzik kullanımında motor tarafından bölünen kararlı F0 bölümleri yeniden sayılmaz; denetim için Ek A'da ayrı olarak saklanırlar.
report.prose.directionalGroupStats=Ortalama, tüm olayların genel eğilimini gösterir; medyan, sıralandıktan sonra tipik orta olayı gösterir; ve süre ağırlıklı ortalama, daha uzun Segâh performanslarına daha fazla ağırlık verir. Daha küçük standart sapma ve MAD, daha benzer performansları gösterirken, daha büyük değerler daha yüksek değişkenliği gösterir.
report.prose.directionalTheory=Bu analizde ölçüm merkezi olarak Segâh kullanılır. Öncelikle Dügâh ile Bûselik arasındaki aday sesleri, sınır tonlarını kendisi hariç tutarak bulur. Daha sonra her adayın Segâh'ye yaklaşımını ve Dügâh'a doğru bir hareketin ondan önce mi yoksa sonra mı gerçekleştiğini kontrol eder.
report.prose.eventsIntro=Bir yıldız işareti (*) önceden tanımlanmış istikrar kriterini karşılamayan olayları işaret eder. Hariç tutulma kriterlerini karşılayan satırlar izlenebilirlik için saklanır, fakat ana tanımlayıcı istatistiklere dahil edilmez.
report.prose.firstFourComparison=Birinci derece, kullanıcı tarafından onaylanan karar ankrajıdır ve yeniden puanlanmaz. Yüzde yalnız sabit ilk-dört-ses alanı içindeki tek bir ortak, karara hizalı F0 kanıt kümesinin ayırt edici 2., 3. ve 4. kuramsal derecelere yakınlığından hesaplanır. İsteğe bağlı bir profilin açılması yalnız gösterilen satırları değiştirir; ortak kanıtı veya mevcut bir puanı değiştirmez. Adlandırılamayan ara sesler kanıtta korunur; ilk-dört-ses alanının üzerindeki perdeler dışarıda bırakılır. Süre, tekrar, güven ve kararlılık ağırlıklandırılır; açıklanamayan kümeler ile eksik derece kapsamı puanı düşürür. Sonuç otomatik makam teşhisi değildir.
report.prose.intervalChart=Gölgelendirilmiş bölge, her iki sınırın da dışlandığı açık analiz aralığını temsil eder, bu nedenle sınır perdelerine ait olaylar çalışma setine dahil edilmez. Aralıktaki her güvenilir ölçülebilir olay küçük bordo nokta olarak gösterilmiştir; bunlar Bölüm 5'te ayrı ayrı listelenen aynı performanslardır. Turkuaz dikey çizgi ve büyük işaret, seçilen makama ait bu aralıkta beklenen kuramsal referans perdesini gösterir. Her F0 olayı en yakın kuramsal 53-Hc perde merkezine göre değerlendirilir. Adlandırma eşik değerini aşan ara sesler silinmez; en yakın merkeze olan C/Hc mesafeleri ile adlandırılmamış gözlem olarak raporda kalırlar. Bu sınıflandırma tek başına bir makam tanısı değildir; seçilen aralıktaki performansların hangi kuramsal merkezlere yaklaştığını nicelendirir.
report.prose.intervalMeans=İlk tablo, her perde için kayıtta duyulan ortalama frekansı ve toniğe göre ortalama C/Hc konumunu gösterir. Teorik konum makam dizisinde beklenen yerdedir; ortalama gözlemlenen konum ölçülen performanstır. İkinci tablo ikisi arasındaki farkı, yani sapmayı özetlemektedir. Genel ortalama satırı, tüm etkinliklerin aritmetik merkezidir ve tek başına yeni bir saha adı olarak yorumlanmamalıdır.
report.prose.intervalPlainExplanation=Bu neyi gösteriyor? Ölçülen temel frekans (F0), algılanan perdede yükseklik belirleyen ana frekans değeridir. Sadece alt ve üst sınırlar arasında kesin olarak yer alan F0 değerleri incelenir; sınır perdeleri kendileri dahil edilmez. Karar ile karşılaştırıldığında, negatif değerler daha düşük bir konumu, pozitif değerler ise daha yüksek bir konumu belirtir.
report.prose.intervalTheory=Seçilen aralık, kullanıcı tarafından onaylanmış tonal frekanstan 53 eşit Holder koması (Hc) cinsinden konumlandırılmıştır. Hc, bir oktavı 53 eşit adıma bölerken, centler (C) bir oktavı 1.200 eşit parçaya böler. Aşağıdaki değerler, kuramsal alt ve üst sınırları ve bunların frekans karşılıklarını göstermektedir.
report.prose.pitchCentreDeviations=Gözlenen merkezler, aynı gerçek F0 kanıtı korunarak en yakın kuramsal perde merkezleriyle karşılaştırılır. Negatif fark gözlenen merkezin kuramsal merkezden pest; pozitif fark ise dik olduğunu gösterir. Ayrı gözlenen tepeler, tek bir yapay ortalamada eritilmeden korunur.
report.prose.pitchPeakDistribution=Bu grafik, seçilen inceleme alanında bulunan bütün temasları korur. Dolu noktalar ana sayısal özete alınan olayları; soluk veya içi boş noktalar ise daha kısa denetim temaslarını gösterir. Yatay konum, karar perdesine göre ölçülen Hc değeridir. Böylece adlandırılmış iki kuramsal merkezin arasında kalan sesler sessizce atılmadan görülebilir.
report.prose.profileComparison=Bu karşılaştırma otomatik makam teşhisi değildir. Kararlı karar-ilişkili aralıkların hangi kuramsal skalaya veya çeşni grubuna en yakın olduğunu gösterir. Makam aynı gruptaki profiller tek bir satırda birleştirilir ve sayısal değerler, o gruptaki en yüksek benzerlik skoruna sahip tam profilden gelir. Yüksek bir yüzde, aralık merkezlerinin ilgili kuramsal yapıya olan yakınlığını gösterir; tek başına makam kimliğini kanıtlamaz. Sonuçlar, melodik seyir, dominant, çeşni, modulasyon ve kadans desenleri ile birlikte değerlendirilmelidir.
report.prose.readingGuide=Aşağıdaki açıklamalar, okuyucuların müzik teorisi veya ses analizinde uzmanlık gerektirmeden tablolar ve grafiklerdeki ölçümleri anlamalarına yardımcı olur. C ve Hc pozisyonları karar ile ilişkili olarak belirtilmiştir; sapmalar ilgili kuramsal perde merkezine göre belirtilmiştir.
report.prose.resultsIntro=Bu bölüm, olay sayısını, ortalamayı, medyanı, süre ağırlıklı ortalamayı ve dağılım genişliğini sunar. Medyan, altında yarısı diğer yarısı üstünde olacak şekilde olayların ortasında yer alan değerdir. Süre ağırlıklı ortalamada, daha uzun sesler kısa temaslardan daha fazla ağırlık taşır. Bu ölçümler tanımlayıcıdır ve yalnızca kayıt sırasında gözlemlenen eğilimi açıklar. Örneklem büyüklüğü dikkate alınmadan, genel bir performans kuralı veya istatistiksel anlamlılık kanıtı olarak yorumlanmamalıdır.
report.prose.singleClassification=Gölgelendirilmiş alan, kullanıcı tarafından seçilen genel bir tolerans penceresi değildir. Bu, hedef perde ile alt ve üst komşu kuramsal perde merkezleri arasındaki ortalamalar tarafından oluşan birbirini dışlayan sınıflandırma bölgesidir. Bu nedenle, aynı F0 karesi iki perdeye atanamaz. Sapma, kuramsal hedef konumdan gözlemlenen karar-ile göreceli konumun çıkarılmasıyla hesaplanır; negatif değerler daha düz, pozitif değerler ise daha tiz performansı gösterir. Bu sınıflandırma, perde merkezinin performansta nasıl gerçekleştirildiğini ölçer ve kendi başına makam kimliğini belirlemez.
report.prose.singlePlainExplanation=Bu neyi gösteriyor? Karara frekansından başlayarak, formül incelenen perdenin kuramsal frekansını Hz cinsinden hesaplar. Kararaya göre, negatif Hc/C değerleri daha düşük bir konumu, pozitif değerler ise daha yüksek bir konumu gösterir. Sonraki performans ölçümleri bu kuramsal hedefle karşılaştırılır.
report.prose.singleTheory=Hedef perdelerin karara ile olan konumu 53-eşit Holder-virgül (Hc) sistemine göre hesaplanır. Hc, bir oktavı 53 eşit adıma bölerken, cent (C) onu 1.200 eşit parçaya böler. Kuramsal hedef frekansı Hertz (Hz) cinsinden elde etmek için onaylanmış karara frekansı kullanılır.
report.prose.smallDirectionalSample=Örnek boyutu uyarısı: {0}'da beşten az güvenilir olay mevcut. Bu satırlar kaydı açıklar ve genel bir performans kuralı olarak yorumlanmamalıdır.
report.prose.sourceMethod=Kayıt, analiz sırasında ortaya çıkan yapay frekansları önlemek için filtrelendi ve 22,05 kHz çalışma kopyasına dönüştürüldü. Perde yüksekliği, temel frekanstan veya F0'tan belirlendi. F0, duyulan sesin temel titreşim frekansını Hertz cinsinden ifade eder. Güvenilir F0 ölçümleri, seçilen makam içindeki birbirini dışlayan 53-Hc kuramsal perde merkezine atandı; istatistiksel değerlendirme yalnızca çalışma kriterlerini karşılayan kanonik olayları kullandı. Geniş analiz bölgeleri, tek başına perde kimliğinin kanıtı olarak kabul edilmedi.
report.prose.tonicDetermination=Karar frekans, seçilen zaman bölgesindeki tüm güvenilir ölçümlerden belirlenir, ton çizgisindeki tek bir noktadan değil. Bu hesaplamada kullanılan sağlam medyan, kısa süreli sıçramalar ve olağan dışı ölçümlerden daha az etkilenir. Güven, dağılım ve olası oktav hataları birlikte değerlendirilir, böylece geçici frekans değişimlerinin karar tahmin üzerindeki etkisi sınırlandırılır.
