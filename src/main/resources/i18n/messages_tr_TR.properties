report.hicaz.method.paths=Çıkıcı ve inici cümleler yalnız zaman içinde sıralanmış ve tek yönde ilerleyen derece yollarından kurulmuştur. Aynı derecedeki kısa bölünmeler yolu bozmaz; olay sayısı, süre ve güven ağırlığı kanıtta korunur. Gerçek yön değişimi yeni bir cümle başlatır ve uzun bir cümle içindeki kısa alt yollar ayrıca sayılmaz.
