report.method.directional.audit=Candidates with 35–65% confidence or only transitional character are retained in the audit table but excluded from the main mean.
report.method.directional.averages=Ascending, descending and sustain means are computed from their own events. The All row is not a mean of group means; it uses every accepted event once.
report.method.directional.candidate=Candidates are selected among pitches between Dügâh and Bûselik; the two boundary pitches themselves are excluded.
report.method.directional.deviation=Each candidate's measured frequency is compared with the theoretical Segâh centre. Negative deviation means a flatter Segâh; positive deviation means a sharper performance.
report.method.directional.path=A reliable Dügâh-to-Segâh motion is classified as ascending, and a Segâh-to-Dügâh motion as descending. Following Çargâh and Nevâ in the same direction strengthens, but is not required for, phrase evidence.
report.method.directional.sustain=Long, stable Segâh sounds without a clear ascending or descending path are evaluated separately as Segâh sustains.
report.method.f0Windows=F0 was estimated with 40 ms analysis windows and steps of approximately 20 ms.
report.method.intervalOpen=The study set is defined by the open-interval condition lower boundary < observed F0 < upper boundary.
report.method.nearest53Hc=For each event in the open interval, the nearest canonical 53-Hc pitch centre is determined and its signed C/Hc distance is calculated.
report.method.robustMedian=To reduce transition effects, each event's representative value was computed from the robust median of its middle body; entry, settled and exit values are also reported.
report.method.unnamedIncluded=Intermediate sonorities beyond the naming threshold are retained as Unnamed and reported with their distance to the nearest theoretical pitch.
report.method.workingCopy=The recording was analyzed from an anti-alias-filtered 22.05 kHz working copy.
