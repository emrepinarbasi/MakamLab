report.glossary.arithmeticMean=Arithmetic mean
report.glossary.arithmeticMeanDefinition=The overall centre obtained by dividing the sum of all values by the number of events.
report.glossary.boxPlot=Box plot
report.glossary.boxPlotDefinition=The middle line shows the median, the box the middle half of events, and points individual events.
report.glossary.cent=A small interval unit obtained by dividing an octave into 1,200 equal parts.
report.glossary.confidenceDefinition=A 0–100 ratio indicating how strongly audio evidence supports the F0 measurement.
report.glossary.deviation=Calculation: observed position - theoretical target. Example: if the target is 90 C and the measurement is 86 C, deviation is -4 C, meaning 4 C flat. A 94 C measurement would be +4 C, or 4 C sharp.
report.glossary.deviationDefinition=Calculation: observed position - theoretical target. Example: if the target is 90 C and the measurement is 86 C, deviation is -4 C, meaning 4 C flat. A 94 C measurement would be +4 C, or 4 C sharp.
report.glossary.f0=The fundamental vibration frequency that determines pitch height.
report.glossary.hc=An interval unit obtained by dividing an octave into 53 equal parts; 1 Hc is approximately 22.64 C.
report.glossary.hz=The number of vibrations per second; the physical unit of frequency.
report.glossary.measurableEvent=Measurable event
report.glossary.measurableEventDefinition=An event that meets minimum duration and confidence conditions and can enter the numerical summary.
report.glossary.medianDefinition=The typical middle value after sorting. Example: the median of -12, -5, -4, +2 and +9 C is -4 C, meaning the typical performance is about 4 C flat of the target.
report.glossary.negativeFlat=Negative / flat
report.glossary.negativeFlatDefinition=The observed sound is lower than the theoretical centre.
report.glossary.oneHcDefinition=A proximity band of approximately ±22.64 C around the theoretical centre.
report.glossary.plainExplanation=Plain explanation
report.glossary.positiveSharp=Positive / sharp
report.glossary.positiveSharpDefinition=The observed sound is higher than the theoretical centre.
report.glossary.stableEvent=Stable event
report.glossary.stableEventDefinition=An event whose pitch fluctuation within its body remains inside the predefined limit.
report.glossary.standardDeviation=Standard deviation / spread
report.glossary.standardDeviationDefinition=This is not one sound's difference from the target; it shows how close all performances are to one another. Small values indicate similarity, larger values greater variability.
report.glossary.term=Term
report.glossary.theoryTarget=Theoretical target / centre
report.glossary.theoryTargetDefinition=The expected C, Hc and Hz position of a pitch according to makam theory.
report.glossary.weightedMeanDefinition=A mean that gives longer events more weight than brief contacts.
report.guide.deviation=Deviation is the difference between the measured performance and the theoretical reference. A negative value is flatter than the reference; a positive value is sharper.
report.guide.mad=MAD describes how far events spread around the median. A smaller MAD means more consistent events; a larger MAD means more variable performance.
report.guide.meanMedian=The mean describes the overall tendency of all events. The median is the typical middle event after the values are ordered and is less affected by a single extreme value.
report.guide.units=C (cent) divides an octave into 1,200 equal parts. Hc is the Holderian comma, which divides the same octave into 53 parts; 1 Hc is approximately 22.64 C.
