report.prose.allRow=The All row is not the simple mean of the three group means. It is recalculated by using every accepted event once, so a group with more events contributes its natural weight to the overall result.
report.prose.closestFirstFourGroup=Makam profiles evaluated together within the {0} group: {1}. These profiles have the same first four theoretical degrees and cannot be distinguished from one another by this evidence alone.
report.prose.directionalCharts=The three charts are independent: the first shows only ascending phrases, the second only descending phrases, and the third only direct Segâh sustains. The shaded region is the same candidate-search area in each chart; the entire region is not automatically treated as Segâh. The turquoise line marks the theoretical Segâh centre, and coloured points mark the accepted merged musical usages in the relevant group.
report.prose.directionalEvents=Each row shows one Segâh usage included in the primary statistics. The Observed path column explains the pitch sequence on which the directional decision is based. Stable F0 segments split by the engine within the same musical usage are not counted again; they are retained separately in Appendix A for audit.
report.prose.directionalGroupStats=The mean shows the overall tendency of all events; the median is the typical middle event after sorting; and the duration-weighted mean gives more weight to longer Segâh performances. Smaller standard deviation and MAD indicate more similar performances, while larger values indicate greater variability.
report.prose.directionalTheory=This analysis uses Segâh as the measurement centre. It first finds candidate sounds between Dügâh and Bûselik, excluding the boundary pitches themselves. It then checks each candidate's proximity to Segâh and whether a motion toward Dügâh occurs before or after it.
report.prose.eventsIntro=An asterisk (*) marks events that do not meet the predefined stability criterion. Rows meeting exclusion criteria are retained for traceability but are not included in the primary descriptive statistics.
report.prose.firstFourComparison=The first degree is the user-confirmed tonic anchor and is not scored again. The percentage is calculated only from the proximity of the discriminating second, third and fourth theoretical degrees to one common tonic-aligned F0 evidence set inside the fixed first-four-pitch domain. Enabling an optional profile changes only the rows displayed; it does not change this evidence set or an existing score. Unnamed intermediate sounds remain in the evidence, while pitches above the first-four domain are excluded. Duration, repetition, confidence and stability are weighted; unexplained clusters and incomplete degree coverage reduce the score. The result is not automatic makam diagnosis.
report.prose.intervalChart=The shaded region represents the open analysis interval with both boundaries excluded, so events belonging to the boundary pitches are not included in the study set. Each reliable measurable event in the interval is shown as a small burgundy point; these are the same performances listed individually in Section 5. The turquoise vertical line and large marker show the theoretical reference pitch expected in this interval for the selected makam. Each F0 event is evaluated against the nearest theoretical 53-Hc pitch centre. Intermediate sonorities beyond the naming threshold are not deleted; they remain in the report as unnamed observations with their C/Hc distance to the nearest centre. This classification is not a makam diagnosis by itself; it quantifies which theoretical centres the performances in the selected interval approach.
report.prose.intervalMeans=The first table shows, for each pitch, the mean frequency heard in the recording and its mean C/Hc position relative to the tonic. The theoretical position is the expected place in the makam scale; the mean observed position is the measured performance. The second table summarizes the difference between the two, namely deviation. The overall-mean row is the arithmetic centre of all events and must not be interpreted as a new pitch name by itself.
report.prose.intervalPlainExplanation=What does this show? The measured fundamental frequency (F0) is the main frequency value that determines perceived pitch height. Only F0 values strictly between the lower and upper boundaries are studied; the boundary pitches themselves are excluded. Relative to the tonic, negative values indicate a lower position and positive values a higher position.
report.prose.intervalTheory=The selected interval is positioned from the user-confirmed tonic frequency in 53 equal Holder commas (Hc). Hc divides an octave into 53 equal steps, while cents (C) divide an octave into 1,200 equal parts. The values below show the lower and upper theoretical boundaries and their frequency equivalents.
report.prose.pitchCentreDeviations=Observed centres are compared with their nearest theoretical pitch centres by using the same measured F0 evidence. A negative difference means that the observed centre is flatter; a positive difference means that it is sharper. Separate observed modes are preserved instead of being replaced by a single artificial mean.
report.prose.pitchPeakDistribution=Every detected contact in the selected analysis region is retained in this chart. Filled points indicate events admitted to the main numerical summary; pale or open points are shorter audit contacts. The horizontal position is the measured tonic-relative Hc value, so sounds between named theoretical centres remain visible rather than being silently discarded.
report.prose.profileComparison=This comparison is not automatic makam diagnosis. It shows which theoretical scale or çeşni group the stable tonic-relative intervals most closely approach. Makam profiles in the same group are merged into one row, whose numerical values come from the complete profile with the highest similarity score in that group. A high percentage indicates proximity of interval centres to the relevant theoretical structure; it does not prove makam identity by itself. Results must be evaluated together with melodic course, dominant, çeşni, modulation and cadence patterns.
report.prose.readingGuide=The explanations below help readers understand the measurements in tables and charts without requiring expertise in music theory or audio analysis. C and Hc positions are stated relative to the tonic; deviations are stated relative to the relevant theoretical pitch centre.
report.prose.resultsIntro=This section presents event count, mean, median, duration-weighted mean and distribution width. The median is the central value with half the events below it and half above it. In the duration-weighted mean, longer sounds carry more weight than brief contacts. These measures are descriptive and explain only the tendency observed in the recording. Without considering sample size, they must not be interpreted as proof of a general performance rule or statistical significance.
report.prose.singleClassification=The shaded area is not a general tolerance window chosen by the user. It is the mutually exclusive classification region formed by the midpoints between the target pitch and its lower and upper neighbouring theoretical pitch centres. Thus, the same F0 frame cannot be assigned to two pitches. Deviation is calculated by subtracting the theoretical target position from the observed tonic-relative position; negative values indicate flatter and positive values sharper performance. This classification measures how the pitch centre is realized in performance and does not determine makam identity by itself.
report.prose.singlePlainExplanation=What does this show? Starting from the tonic frequency, the formula calculates the theoretical frequency in Hz of the studied pitch. Relative to the tonic, negative Hc/C values indicate a lower position and positive values a higher position. Subsequent performance measurements are compared with this theoretical target.
report.prose.singleTheory=The target pitch's position relative to the tonic is calculated in the 53-equal Holder-comma (Hc) system. Hc divides an octave into 53 equal steps, while cents (C) divide it into 1,200 equal parts. The approved tonic frequency is used to obtain the theoretical target frequency in hertz (Hz).
report.prose.smallDirectionalSample=Sample-size warning: fewer than five reliable events are available in {0}. These rows describe the recording and must not be interpreted as a general performance rule.
report.prose.sourceMethod=The recording was filtered to avoid artificial frequencies introduced during analysis and converted to a 22.05 kHz working copy. Pitch height was determined from the fundamental frequency, or F0. F0 expresses the basic vibration frequency of the heard sound in hertz. Reliable F0 measurements were assigned to mutually exclusive 53-Hc theoretical pitch centres in the selected makam; statistical evaluation used only canonical events that met the study criteria. Wide analysis regions were not accepted as proof of pitch identity by themselves.
report.prose.tonicDetermination=The tonic frequency is determined from all reliable measurements in the selected time region, not from a single point on the pitch trace. The robust median used in this calculation is less affected by brief jumps and unusual measurements. Confidence, spread and possible octave errors are evaluated together to limit the effect of transient frequency changes on the tonic estimate.
