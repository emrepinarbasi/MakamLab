name: Feature request
description: Propose a focused analysis, reporting, or accessibility improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research or user problem
      description: Describe the need before proposing the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true
  - type: textarea
    id: method
    attributes:
      label: Methodological consequences
      description: Explain any effect on thresholds, 53-Hc references, evidence selection, scores, or reports.
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
      description: Describe synthetic or shareable evidence that could verify the feature.
